<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistem Informasi Pemetaan & Reservasi Ruang Kelas | UNJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #14532D;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      animation: fadeInUp 0.6s ease-out;
    }

    .loading-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .loading-logo-icon {
      width: 3.5rem;
      height: 3.5rem;
      animation: pulse 2s infinite;
    }

    .loading-logo-text {
      display: flex;
      flex-direction: column;
    }

    .loading-logo-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .loading-logo-subtitle {
      font-size: 0.8125rem;
      font-weight: 400;
      opacity: 0.7;
      margin-top: 0.125rem;
    }

    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-size: 0.875rem;
      opacity: 0.6;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(1rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-logo">
      <svg class="loading-logo-icon" viewBox="0 0 56 56" fill="none">
        <rect width="56" height="56" rx="12" fill="#E8F3EC" opacity="0.15"/>
        <path d="M14 40V20l14-8 14 8v20l-14 8-14-8z" fill="#E8F3EC" opacity="0.3"/>
        <path d="M14 40V20l14-8 14 8v20l-14 8-14-8z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <path d="M28 12v36M14 20l14 8 14-8" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      </svg>
      <div class="loading-logo-text">
        <span class="loading-logo-title" style="font-size: 1.15rem; max-width: 340px; text-align: left;">Sistem Informasi Pemetaan & Reservasi Ruang Kelas</span>
        <span class="loading-logo-subtitle">Universitas Negeri Jakarta</span>
      </div>
    </div>

    <div class="loading-spinner">
      <div class="spinner"></div>
      <span class="loading-text">Memuat aplikasi...</span>
    </div>
  </div>

  <!-- Core scripts untuk seeding data -->
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/routes.js"></script>
  <script src="assets/js/core/utils.js"></script>

  <!-- Data dummy -->
  <script src="assets/js/data/users.js"></script>
  <script src="assets/js/data/buildings.js"></script>
  <script src="assets/js/data/rooms.js"></script>
  <script src="assets/js/data/floorplans.js"></script>
  <script src="assets/js/data/prodi.js"></script>
  <script src="assets/js/data/courses.js"></script>
  <script src="assets/js/data/relations.js"></script>
  <script src="assets/js/data/bookings.js"></script>
  <script src="assets/js/data/notifications.js"></script>
  <script src="assets/js/data/logs.js"></script>

  <!-- Store (seed data) -->
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/auth.js"></script>

  <script>
    // Seed data dummy saat pertama kali
    App.store.seed()

    // Redirect setelah 1-1.5 detik
    var delay = 1000 + Math.random() * 500
    setTimeout(function () {
      window.location.href = App.routes.public.landing
    }, delay)
  </script>
</body>
</html>
