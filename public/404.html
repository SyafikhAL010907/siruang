<!-- 🆕 TAMBAHAN -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Halaman Tidak Ditemukan | Reservasi Ruangan UNJ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../assets/js/core/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
</head>
<body class="bg-white" style="font-family:'Inter',system-ui,sans-serif;">
  <div id="app">
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
      <div class="text-center max-w-md">
        <!-- Ilustrasi 404 -->
        <div class="mb-8">
          <svg width="200" height="160" viewBox="0 0 200 160" fill="none" class="mx-auto" aria-hidden="true">
            <rect x="20" y="40" width="160" height="100" rx="12" fill="#E8F3EC" />
            <rect x="35" y="55" width="130" height="70" rx="8" fill="#F5F9F6" stroke="#D5E2D9" stroke-width="2"/>
            <!-- 404 text -->
            <text x="100" y="105" text-anchor="middle" font-family="Inter,sans-serif" font-size="40" font-weight="800" fill="#14532D" opacity="0.3">404</text>
            <!-- Magnifying glass -->
            <circle cx="145" cy="45" r="18" stroke="#14532D" stroke-width="3" fill="none" opacity="0.4"/>
            <line x1="158" y1="58" x2="172" y2="72" stroke="#14532D" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
            <!-- Question mark -->
            <text x="145" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#14532D" opacity="0.4">?</text>
          </svg>
        </div>

        <h1 class="text-3xl font-bold mb-3" style="color:var(--color-ink);">Halaman Tidak Ditemukan</h1>
        <p class="text-base mb-8" style="color:var(--color-muted);">
          Maaf, halaman yang Anda cari tidak ada atau telah dipindahkan. Periksa kembali URL atau kembali ke beranda.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <a id="btn-home" href="../index.html" class="btn btn-primary btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Kembali ke Beranda
          </a>
          <button onclick="history.back()" class="btn btn-secondary btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Halaman Sebelumnya
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/routes.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/store.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script>
    // Update link beranda sesuai routes
    document.getElementById('btn-home').href = App.routes.public.landing
  </script>
</body>
</html>
