<!-- 🆕 TAMBAHAN -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>403 — Akses Ditolak | Reservasi Ruangan UNJ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../assets/js/core/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
</head>
<body class="bg-white" style="font-family:'Inter',system-ui,sans-serif;">
  <div id="app">
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
      <div class="text-center max-w-md">
        <!-- Ilustrasi 403 -->
        <div class="mb-8">
          <svg width="200" height="160" viewBox="0 0 200 160" fill="none" class="mx-auto" aria-hidden="true">
            <rect x="20" y="40" width="160" height="100" rx="12" fill="#FEE2E2" />
            <rect x="35" y="55" width="130" height="70" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
            <!-- 403 text -->
            <text x="100" y="105" text-anchor="middle" font-family="Inter,sans-serif" font-size="40" font-weight="800" fill="#DC2626" opacity="0.3">403</text>
            <!-- Lock icon -->
            <rect x="82" y="20" width="36" height="30" rx="5" fill="none" stroke="#DC2626" stroke-width="3" opacity="0.5"/>
            <path d="M90 20v-6a10 10 0 0120 0v6" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
            <circle cx="100" cy="33" r="3" fill="#DC2626" opacity="0.5"/>
          </svg>
        </div>

        <h1 class="text-3xl font-bold mb-3" style="color:var(--color-ink);">Akses Ditolak</h1>
        <p class="text-base mb-8" style="color:var(--color-muted);">
          Maaf, Anda tidak memiliki izin untuk mengakses halaman ini. Silakan hubungi administrator jika Anda merasa ini adalah kesalahan.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <a id="btn-dashboard" href="../index.html" class="btn btn-primary btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span id="btn-dashboard-text">Kembali ke Beranda</span>
          </a>
          <button onclick="history.back()" class="btn btn-secondary btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Halaman Sebelumnya
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/routes.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/store.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script>
    // Sesuaikan tombol kembali berdasarkan role
    var user = App.auth.currentUser()
    var btnDashboard = document.getElementById('btn-dashboard')
    var btnText = document.getElementById('btn-dashboard-text')

    if (user) {
      var redirect = App.auth.getDefaultRedirect(user.role)
      btnDashboard.href = redirect
      btnText.textContent = 'Ke Dashboard'
    } else {
      btnDashboard.href = App.routes.public.landing
      btnText.textContent = 'Kembali ke Beranda'
    }
  </script>
</body>
</html>
